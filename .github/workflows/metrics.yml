
Metrics · YML
name: Generate Profile Metrics
 
on:
  schedule:
    # Runs once a day at 00:00 UTC — edit if you want it more/less often
    - cron: "0 0 * * *"
  workflow_dispatch:
    # Lets you trigger it manually from the Actions tab any time
 
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.svg
 
          # --- Core stats card (replaces github-readme-stats "Autumn Analytics") ---
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
 
          # --- Top languages (replaces the top-langs badge) ---
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
 
          # --- Achievements (replaces the Trophy Cabinet) ---
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
 
          # --- Theme: keep it close to the autumn look ---
          config_display: large
          plugin_lines: yes
 

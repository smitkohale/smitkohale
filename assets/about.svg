    <text x="514" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffcc80">satellite imagery</text>
    <circle cx="498" cy="219" r="3" fill="#ff8f3f"/>
    <text x="514" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffcc80">🗄️  ETL pipelines &amp; schemas for</text>

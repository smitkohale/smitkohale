  <text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffe0b2">🍂  About Me</text>
  <text x="40" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-style="italic" fill="#d7a373">Smit Vijay Kohale  ·  Data Analyst · Data Engineer · Applied ML</text>
  <text x="40" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c99a6c">Nagpur, Maharashtra, India</text>

  <line x1="40" y1="118" x2="860" y2="118" stroke="#5d4037" stroke-width="1"/>
  <line x1="465" y1="135" x2="465" y2="490" stroke="#5d4037" stroke-width="1"/>

    <text x="40" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e8c9a0">I turn messy, real-world data — satellite pixels,</text>
    <text x="40" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e8c9a0">e-commerce reviews, financial transactions — into</text>
    <text x="40" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e8c9a0">systems that catch what humans miss.</text>
    <text x="40" y="226" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e8c9a0">I build the full pipeline: schema design, ETL, and</text>
    <text x="40" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e8c9a0">the model on top, not just notebooks. At MRSAC I</text>
    <text x="40" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e8c9a0">helped architect the backend that turns raw satellite</text>
    <text x="40" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e8c9a0">imagery into a live early-warning system across 15+</text>
    <text x="40" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e8c9a0">districts. At Dealintra, I built the graph + NLP</text>
    <text x="40" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e8c9a0">pipeline that caught coordinated fake-review rings</text>
    <text x="40" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e8c9a0">hiding inside 50,000+ reviews.</text>
    <text x="40" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e8c9a0">I like problems where the interesting part isn't the</text>
    <text x="40" y="412" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e8c9a0">model — it's the schema, the pipeline, the edge</text>
    <text x="40" y="434" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e8c9a0">cases, and turning a prediction into something a</text>
    <text x="40" y="456" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e8c9a0">non-technical stakeholder can actually act on.</text>
<text x="490" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffb74d">WHAT I BUILD</text>
